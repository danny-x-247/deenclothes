<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Deen Clothing</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f3ee;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .login-container > p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ddd;
            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #8b5e3c;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 7px;

            background: #171717;
            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            min-height: 22px;
        }

        .back-link {
            display: block;

            margin-top: 25px;

            text-align: center;
            color: #8b5e3c;

            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Store Admin</h1>

        <p>Sign in to manage your products.</p>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Admin email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginBtn"
            >
                Sign In
            </button>

        </form>


        <div id="message"></div>


        <a
            href="../index.html"
            class="back-link"
        >
            ← Back to Store
        </a>

    </div>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Login JavaScript -->
    <script src="login.js"></script>

</body>
</html>
